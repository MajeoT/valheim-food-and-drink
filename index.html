/* Layout: longhouse board. Sticky "table" of 3 plates on top, larder shelves (card grid) below. Single dark look by design. */
:root{
  color-scheme:dark;
  --bg:#1c1917; --plank:#2a221c; --plank-hi:#33291f; --edge:#4a3a2a;
  --ink:#ede4d3; --muted:#a8998a; --gold:#f59e0b;
  --font-display:"Grenze Gotisch","Palatino Linotype",Georgia,serif;
  --font-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;
  background-image:radial-gradient(ellipse at 50% -10%,rgba(245,158,11,.10),transparent 55%)}
.display{font-family:var(--font-display);letter-spacing:.01em;text-wrap:balance}
.wood{background-color:var(--plank);border:1px solid var(--edge);
  background-image:repeating-linear-gradient(91deg,rgba(255,255,255,.022) 0 1px,transparent 1px 6px),
    repeating-linear-gradient(89deg,rgba(0,0,0,.10) 0 2px,transparent 2px 23px),
    linear-gradient(180deg,var(--plank-hi),var(--plank))}
.num{font-variant-numeric:tabular-nums}
.rune{color:var(--gold);opacity:.55;letter-spacing:.35em;font-size:.8rem}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
select{background-color:#292524}
#boot{padding:48px 16px;text-align:center;color:var(--muted)}
</style>

const fmtDur = (s) => (s >= 60 ? `${Math.round(s / 60)}m` : `${s}s`);
const fuzzyOne = (q, t) => {
  t = t.toLowerCase();
  if (t.includes(q)) return true;
  let i = 0;
  for (const c of t) { if (c === q[i]) i++; if (i === q.length) return true; }
  return false;
};
const fuzzy = (q, item) => {
  q = q.trim().toLowerCase().replace(/\s+/g, "");
  if (!q) return true;
  return fuzzyOne(q, item.name.replace(/\s+/g, "")) || item.ing.some(([n]) => fuzzyOne(q, n.replace(/\s+/g, "")));
};
// Best foods available up to a biome tier. Falls back to stamina when no eitr food exists yet.
const buildPreset = (pick, tier, list = FOODS) => {
  const pool = list.filter((f) => BIOMES.indexOf(f.biome) <= tier);
  const chosen = [];
  pick.forEach((stat) => {
    let cands = pool.filter((f) => !chosen.includes(f.id));
    if (stat === "eitr" && !cands.some((f) => f.eitr > 0)) stat = "st";
    cands.sort((a, b) => b[stat] - a[stat] || b.regen - a.regen);
    if (cands[0]) chosen.push(cands[0].id);
  });
  return chosen;
};

  foods: (p && Array.isArray(p.foods) ? p.foods : []).filter((id, i, a) => FOODS.some((f) => f.id === id) && a.indexOf(id) === i).slice(0, 3),
})).filter((p) => p.name && p.foods.length) : [];
const normName = (t) => t.toLowerCase().replace(/[‘’`´]/g, "'").replace(/\s+/g, " ").trim();
const FOOD_BY_NORM = new Map(FOODS.map((f) => [normName(f.name), f.id]));

const textToPresets = (raw) => {
  const t = raw.trim();
  if (t.startsWith("{") || t.startsWith("[")) {
    try { const d = JSON.parse(t); return cleanPresets(Array.isArray(d) ? d : d && d.presets); } catch (e) {}
  }
  return cleanPresets(t.split(/\r?\n/).map((line) => {
    const l = line.replace(/^[\s>•]+/, "");
    const i = l.lastIndexOf(":");
    if (i < 1) return null;
    return { name: l.slice(0, i), foods: l.slice(i + 1).split("+").map((x) => FOOD_BY_NORM.get(normName(x))).filter(Boolean) };
  }).filter(Boolean));
};

const EDIT_KEY = "valheim-planner-edits";
const EDIT_HEAD = "Valheim planner corrections";
const EDIT_LABEL = { hp: "health", st: "stamina", eitr: "eitr", min: "minutes", regen: "regen", duration: "lasts", cooldown: "cooldown" };
const ITEM_BY_NORM = new Map([...FOODS.map((f) => [normName(f.name), { item: f, isFood: true }]), ...MEADS.map((m) => [normName(m.name), { item: m, isFood: false }])]);
const toNum = (v) => { if (v == null || String(v).trim() === "") return null; const n = Math.round(Number(v)); return Number.isFinite(n) ? Math.min(9999, Math.max(0, n)) : null; };
const baseVal = (item, k) => (k === "min" ? Math.round(item.duration / 60) : item[k]);
// Keeps only real items, valid numbers and values that differ from the defaults.
const cleanEdits = (raw) => {
  const out = {};
  if (!raw || typeof raw !== "object") return out;
  Object.keys(raw).forEach((key) => {
    const hit = ITEM_BY_NORM.get(normName(key));
    const e = raw[key];
    if (!hit || !e || typeof e !== "object") return;
    const { item, isFood } = hit;
    const o = {};
    (isFood ? ["hp", "st", "eitr", "min", "regen"] : ["duration", "cooldown"]).forEach((k) => {
      const n = toNum(e[k]);
      if (n != null && n !== baseVal(item, k)) o[k] = n;
    });
    if (e.ing && typeof e.ing === "object") {
      const ing = {};
      item.ing.forEach(([n, q]) => { const v = toNum(e.ing[n] != null ? e.ing[n] : e.ing[normName(n)]); if (v != null && v !== q) ing[n] = v; });
      if (Object.keys(ing).length) o.ing = ing;
    }
    if (Object.keys(o).length) out[item.id] = o;
  });
  return out;
};
const withEdits = (item, e, isFood) => {
  if (!e) return item;
  const o = { ...item, edited: true };
  if (isFood) {
    ["hp", "st", "eitr", "regen"].forEach((k) => { if (e[k] != null) o[k] = e[k]; });
    if (e.min != null) o.duration = e.min * 60;
    o.type = focusOf(o.hp, o.st, o.eitr);
  } else {
    ["duration", "cooldown"].forEach((k) => { if (e[k] != null) o[k] = e[k]; });
  }
  if (e.ing) o.ing = item.ing.map(([n, q]) => [n, e.ing[n] != null ? e.ing[n] : q]);
  return o;
};
// One item per line: "Bread | health 25 | stamina 72 | Barley flour 8".
const editsToText = (edits) => [EDIT_HEAD, ...Object.keys(edits).map((id) => {
  const e = edits[id];
  return [id, ...Object.keys(EDIT_LABEL).filter((k) => e[k] != null).map((k) => `${EDIT_LABEL[k]} ${e[k]}`), ...Object.keys(e.ing || {}).map((n) => `${n} ${e.ing[n]}`)].join(" | ");
})].join("\n");
const textToEdits = (raw) => {
  const out = {};
  raw.split(/\r?\n/).forEach((line) => {
    const parts = line.replace(/^[\s>•]+/, "").split("|").map((x) => x.trim());
    if (parts.length < 2) return;
    const e = { ing: {} };
    parts.slice(1).forEach((part) => {
      const m = part.match(/^(.*\S)\s+(\d+)$/);
      if (!m) return;
      const key = Object.keys(EDIT_LABEL).find((k) => EDIT_LABEL[k] === normName(m[1]));
      if (key) e[key] = m[2]; else e.ing[normName(m[1])] = m[2];
    });
    out[parts[0]] = e;
  });
  return cleanEdits(out);
};
const loadEdits = () => { try { return cleanEdits(JSON.parse(localStorage.getItem(EDIT_KEY) || "{}")); } catch (e) { return {}; } };

            <div className="flex min-w-0 flex-col gap-2">
              <h3 className="font-bold text-stone-100">Add corrections a friend sent</h3>
              <label htmlFor="edits-import" className="sr-only">Paste corrections text</label>
              <textarea id="edits-import" value={text} onChange={(e) => setText(e.target.value)} placeholder="Paste corrections text here" rows={4}
                className="w-full rounded-sm border border-stone-700 bg-stone-950/60 p-2 font-mono text-xs text-stone-200 placeholder:text-stone-600" />
              <button type="button" onClick={add} disabled={!text.trim()} className={`${btnQuiet} w-fit`}><Plus size={15} aria-hidden="true" />Add pasted corrections</button>
            </div>
            <div className="flex min-w-0 flex-col gap-2">
              <h3 className="font-bold text-stone-100">Your corrections as text</h3>
              <label htmlFor="edits-export" className="sr-only">Your corrections as text</label>
              <textarea id="edits-export" readOnly value={n ? exportText : ""} placeholder="Edit a figure and it appears here." rows={4} onFocus={(e) => e.target.select()}
                className="w-full rounded-sm border border-stone-700 bg-stone-950/60 p-2 font-mono text-xs text-stone-300 placeholder:text-stone-600" />
            </div>
          </div>
          <div className="flex flex-wrap items-center gap-2 border-t border-stone-700 pt-3">
            <label htmlFor="edits-reset" className="text-sm font-bold text-stone-200">Reset to default</label>
            <select id="edits-reset" value={target} onChange={(e) => { setTarget(e.target.value); setConfirm(false); }} className="rounded-sm border border-stone-700 px-2 py-1.5 text-sm text-stone-100">
              <option value="All">Everything ({n})</option>
              {BIOMES.map((b) => <option key={b} value={b}>{b} ({countFor(b)})</option>)}
            </select>
            {confirm ? (
              <span className="flex flex-wrap items-center gap-2 rounded-sm border border-red-800 bg-red-950/50 px-2.5 py-1 text-sm text-red-100">
                Undo {countFor(target)} edit{countFor(target) === 1 ? "" : "s"}?
                <button type="button" onClick={doReset} className="rounded-sm bg-red-600 px-2 py-0.5 font-bold text-white hover:bg-red-500">Yes, reset</button>
                <button type="button" onClick={() => setConfirm(false)} className="rounded-sm border border-stone-500 px-2 py-0.5 font-bold text-stone-200 hover:border-stone-300">Keep them</button>
              </span>
            ) : (
              <button type="button" onClick={() => setConfirm(true)} disabled={!countFor(target)} className={btnQuiet}><Undo size={15} aria-hidden="true" />Reset</button>
            )}
          </div>
        </div>
      )}
      {msg && <p role="status" aria-live="polite" className="border-t border-stone-700 px-3 py-2 text-sm text-amber-300">{msg}</p>}
    </section>
  );
};

/* ───────── App ───────── */
function App() {
  const [edits, setEdits] = useState(loadEdits);
  useEffect(() => { try { localStorage.setItem(EDIT_KEY, JSON.stringify(edits)); } catch (e) {} }, [edits]);
  const foodsAll = useMemo(() => FOODS.map((f) => withEdits(f, edits[f.id], true)), [edits]);
  const meadsAll = useMemo(() => MEADS.map((m) => withEdits(m, edits[m.id], false)), [edits]);
  const saveEdit = (id, patch) => setEdits((prev) => { const next = { ...prev }; delete next[id]; return patch ? { ...next, ...cleanEdits({ [id]: patch }) } : next; });
  const [ingredient, setIngredient] = useState(null);
  const [news, setNews] = useState(() => !newsSeen());
  const closeNews = () => { try { localStorage.setItem(NEWS_KEY, NEWS_ID); } catch (e) {} setNews(false); };
  const [slots, setSlots] = useState(() => buildPreset(["hp", "st", "eitr"], 7, foodsAll));
  const [tier, setTier] = useState(7);
  const [tab, setTab] = useState("foods");
  const [biome, setBiome] = useState("All");
  const [focus, setFocus] = useState("All");
  const [cat, setCat] = useState("All");
  const [q, setQ] = useState("");
  const [sort, setSort] = useState("progression");
  const [showList, setShowList] = useState(false);
  const [station, setStation] = useState(null);
  const [saved, setSaved] = useState(loadSaved);
  useEffect(() => { try { localStorage.setItem(LS_KEY, JSON.stringify(saved)); } catch (e) {} }, [saved]);

  const picked = slots.map((id) => foodsAll.find((f) => f.id === id)).filter(Boolean);
  const totals = {
    hp: BASE.hp + picked.reduce((a, f) => a + f.hp, 0),
    st: BASE.st + picked.reduce((a, f) => a + f.st, 0),
    eitr: BASE.eitr + picked.reduce((a, f) => a + f.eitr, 0),
    regen: picked.reduce((a, f) => a + f.regen, 0),
  };
  const shopping = useMemo(() => {
    const map = new Map();
    picked.forEach((f) => (f.ing.length ? f.ing : [[f.name, 1]]).forEach(([n, qty]) => map.set(n, (map.get(n) || 0) + qty)));
    return [...map.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  }, [slots.join("|"), edits]);

  const replaceAt = (i, id) => setSlots((s) => s.map((x, j) => (j === i ? id : x)));
  const toggle = (id) => setSlots((s) => (s.includes(id) ? s.filter((x) => x !== id) : s.length < 3 ? [...s, id] : s));

  const foods = useMemo(() => {
    const list = foodsAll.filter((f) => (biome === "All" || f.biome === biome) && (focus === "All" || f.type === focus) && fuzzy(q, f));
    const by = { health: (a, b) => b.hp - a.hp, stamina: (a, b) => b.st - a.st, eitr: (a, b) => b.eitr - a.eitr, duration: (a, b) => b.duration - a.duration };
    return sort === "progression" ? list : [...list].sort(by[sort]);
  }, [biome, focus, q, sort, foodsAll]);
  const meads = useMemo(() => {
    const list = meadsAll.filter((m) => (biome === "All" || m.biome === biome) && (cat === "All" || m.category === cat) && fuzzy(q, m));
    return sort === "duration" ? [...list].sort((a, b) => b.duration - a.duration) : list;
  }, [biome, cat, q, sort, meadsAll]);
  const shown = tab === "foods" ? foods : meads;
  const ranks = useMemo(() => { const out = {}; BIOMES.forEach((b) => Object.assign(out, rankFoods(foodsAll.filter((f) => f.biome === b)))); return out; }, [foodsAll]);
  const reset = () => { setBiome("All"); setFocus("All"); setCat("All"); setQ(""); };

  return (
    <MotionConfig reducedMotion="user">
      <div className="mx-auto max-w-7xl px-4 pb-16">
        <header className="pb-5 pt-8">
          <p className="rune" aria-hidden="true">ᚠᛟᛟᛞ ᚨᚾᛞ ᛗᛖᚨᛞ</p>
          <h1 className="display text-4xl font-bold text-amber-400 sm:text-5xl">Valheim Mead &amp; Feast Planner</h1>
          <p className="mt-1 max-w-prose text-lg text-stone-400">Fill three plates, read your health, stamina and eitr before you leave the hall, and see what to gather.</p>

          <section aria-labelledby="presets-h" className="mt-5">
            <div className="flex flex-wrap items-center gap-x-3 gap-y-2">
              <h2 id="presets-h" className="text-xs font-bold uppercase tracking-widest text-stone-400">Quick builds</h2>
              <label htmlFor="tier" className="flex items-center gap-2 text-sm text-stone-400">using food up to
                <select id="tier" value={tier} onChange={(e) => setTier(+e.target.value)} className="rounded-sm border border-stone-700 px-2 py-1 text-stone-100">
                  {BIOMES.map((b, i) => <option key={b} value={i}>{b}</option>)}
                </select>
              </label>
            </div>
            <div className="mt-2 grid grid-cols-2 gap-2 lg:grid-cols-4">
              {PRESETS.map((p) => (
                <motion.button key={p.id} whileTap={{ scale: 0.97 }} onClick={() => setSlots(buildPreset(p.pick, tier, foodsAll))}
                  className="wood group flex items-center gap-2.5 rounded-sm p-2.5 text-left transition-colors hover:border-amber-500">
                  <p.Icon size={22} className="shrink-0 text-amber-500 transition-transform group-hover:scale-110" aria-hidden="true" />
                  <span className="min-w-0"><span className="block font-bold leading-tight text-stone-100">{p.label}</span><span className="block text-sm text-stone-400">{p.hint}</span></span>
                </motion.button>
              ))}
            </div>
          </section>
          <MyPresets saved={saved} setSaved={setSaved} picked={picked} slots={slots} onLoad={setSlots} />
        </header>

        {/* Sticky meal builder */}
        <section aria-label="Meal builder" className="sticky z-20 -mx-4 border-y border-amber-900/60 bg-stone-900/95 px-4 py-3 shadow-xl shadow-black/50 backdrop-blur"
          style={{ top: "env(safe-area-inset-top, 0px)" }}>
          <div className="grid grid-cols-3 gap-2">
            {[0, 1, 2].map((i) => {
              const f = picked[i];
              return (
                <div key={i} className={`flex min-h-[4.5rem] min-w-0 items-stretch rounded-sm border px-2 py-1.5 ${f ? "wood" : "items-center border-dashed border-stone-700 bg-stone-950/40"}`}>
                  <AnimatePresence mode="wait" initial={false}>
                    {f ? (
                      <motion.div key={f.id} initial={{ opacity: 0, y: 6 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: -6 }} transition={{ duration: 0.15 }} className="flex min-w-0 flex-1 flex-col gap-1.5">
                        <div className="flex items-start justify-between gap-1.5">
                          <p className="min-w-0 break-words text-sm font-bold leading-tight text-stone-100 sm:text-base"><Fork type={f.type} size={14} /> {f.name}</p>
                          <button onClick={() => toggle(f.id)} aria-label={`Remove ${f.name} from plate ${i + 1}`}
                            className="flex shrink-0 items-center gap-1 rounded-sm border border-red-800 bg-red-950/60 px-1.5 py-0.5 text-xs font-bold text-red-200 transition-colors hover:bg-red-600 hover:text-white">
                            <X size={13} aria-hidden="true" /><span className="hidden sm:inline">Remove</span>
                          </button>
                        </div>
                        <div className="mt-auto flex flex-wrap items-center gap-1">
                          {["hp", "st", "eitr"].filter((k) => f[k] > 0).map((k) => <Badge key={k} stat={k} value={`+${f[k]}`} small />)}
                          <span className="num inline-flex items-center gap-0.5 rounded-sm border border-stone-600 px-1 py-px text-xs font-bold text-stone-300" title="How long this food lasts after eating"><Timer size={11} aria-hidden="true" />{fmtDur(f.duration)}<span className="hidden font-normal sm:inline">&nbsp;buff</span></span>
                        </div>
                      </motion.div>
                    ) : (
                      <motion.p key="empty" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="flex items-center gap-1.5 self-center text-sm text-stone-500"><Utensils size={14} aria-hidden="true" />Plate {i + 1} is empty</motion.p>
                    )}
                  </AnimatePresence>
                </div>
              );
            })}
          </div>
          <div className="mt-3 grid grid-cols-3 gap-3 sm:grid-cols-[1fr_1fr_1fr_auto] sm:items-end">
            {["hp", "st", "eitr"].map((s) => <StatBar key={s} stat={s} total={totals[s]} parts={picked.map((f) => f[s])} />)}
            <div className="col-span-3 flex items-center justify-between gap-3 sm:col-span-1 sm:justify-end">
              <p className="num text-sm text-stone-300"><span className="display text-xl text-red-300">+{totals.regen}</span> hp per 10s tick</p>
              <div className="flex flex-wrap justify-end gap-1.5">
                <button onClick={() => setShowList((v) => !v)} aria-expanded={showList} className="flex items-center gap-1.5 rounded-sm border border-amber-700 px-2.5 py-1.5 text-sm font-bold text-amber-300 hover:bg-amber-500 hover:text-stone-950">
                  <Basket size={15} aria-hidden="true" />Shopping list
                  <Chevron size={14} className={`transition-transform ${showList ? "rotate-180" : ""}`} aria-hidden="true" />
                </button>
                <button onClick={() => setSlots([])} disabled={!picked.length} className="flex items-center gap-1.5 rounded-sm border border-stone-600 px-2.5 py-1.5 text-sm font-bold text-stone-300 hover:border-red-600 hover:text-red-300 disabled:opacity-30"><Trash size={15} aria-hidden="true" />Clear plates</button>
              </div>
            </div>
          </div>
          <AnimatePresence initial={false}>
            {showList && (
              <motion.div initial={{ height: 0, opacity: 0 }} animate={{ height: "auto", opacity: 1 }} exit={{ height: 0, opacity: 0 }} className="overflow-hidden">
                <div className="mt-3 max-h-[40vh] overflow-y-auto border-t border-stone-700 pt-3">
                  {shopping.length ? (
                    <>
                      <ul className="grid grid-cols-2 gap-x-4 gap-y-1 sm:grid-cols-3 lg:grid-cols-4">
                        {shopping.map(([n, qty]) => <li key={n} className="flex items-baseline gap-2 text-stone-200"><span className="num w-8 shrink-0 text-right font-bold text-amber-400">{qty}×</span><button type="button" onClick={() => setIngredient(n)} title={`Where to get ${n}`} className={`min-w-0 ${ingBtn}`}>{n}</button></li>)}
                      </ul>
                      <p className="mt-2 text-sm text-stone-500">Raw ingredients for one craft of each recipe. Base stats without food are 25 health and 50 stamina.</p>
                    </>
                  ) : <p className="text-stone-500">Put a food on a plate and its ingredients will be tallied here.</p>}
                </div>
              </motion.div>
            )}
          </AnimatePresence>
        </section>

        {/* Explorer */}
        <section aria-label="Database" className="pt-6">
          <div className="flex flex-wrap items-center gap-3">
            <div role="tablist" className="flex rounded-sm border border-stone-700 bg-stone-950/50 p-0.5">
              {[["foods", "Foods", Utensils, FOODS.length], ["meads", "Drinks & Meads", Flask, MEADS.length]].map(([id, label, Ic, n]) => (
                <button key={id} role="tab" aria-selected={tab === id} onClick={() => { setTab(id); setSort("progression"); }}
                  className={`relative flex items-center gap-1.5 rounded-sm px-3 py-1.5 font-bold transition-colors ${tab === id ? "text-stone-950" : "text-stone-300 hover:text-amber-300"}`}>
                  {tab === id && <motion.span layoutId="tab" className="absolute inset-0 rounded-sm bg-amber-500" />}
                  <span className="relative flex items-center gap-1.5"><Ic size={15} aria-hidden="true" />{label}<span className="num text-xs opacity-70">{n}</span></span>
                </button>
              ))}
            </div>
            <div className="relative min-w-[12rem] flex-1">
              <Search size={16} className="pointer-events-none absolute left-2.5 top-1/2 -translate-y-1/2 text-stone-500" aria-hidden="true" />
              <label htmlFor="search" className="sr-only">Search by name or ingredient</label>
              <input id="search" value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search name or ingredient, e.g. honey"
                className="w-full rounded-sm border border-stone-700 bg-stone-950/60 py-1.5 pl-8 pr-3 text-stone-100 placeholder:text-stone-500" />
            </div>
            <label htmlFor="sort" className="flex items-center gap-2 text-sm text-stone-400">Sort
              <select id="sort" value={sort} onChange={(e) => setSort(e.target.value)} className="rounded-sm border border-stone-700 px-2 py-1.5 text-stone-100">
                <option value="progression">Progression order</option>
                {tab === "foods" && <><option value="health">Highest health</option><option value="stamina">Highest stamina</option><option value="eitr">Highest eitr</option></>}
                <option value="duration">Longest duration</option>
              </select>
            </label>
          </div>
          <div className="mt-3 flex flex-wrap gap-1.5" aria-label="Biome filter">
            {["All", ...BIOMES].map((b) => <Pill key={b} active={biome === b} onClick={() => setBiome(b)}><span className="inline-flex items-center gap-1.5">{b !== "All" && <span className="h-2 w-2 rounded-full ring-1 ring-black/40" style={{ backgroundColor: BIOME_HEX[b] }} aria-hidden="true" />}{b === "All" ? "All biomes" : b}</span></Pill>)}
          </div>
          <div className="mt-2 flex flex-wrap gap-1.5" aria-label={tab === "foods" ? "Stat focus filter" : "Category filter"}>
            {tab === "foods"
              ? ["All", "Health", "Stamina", "Eitr", "Balanced"].map((t) => <Pill key={t} active={focus === t} onClick={() => setFocus(t)}>{t === "All" ? "Any focus" : t}</Pill>)
              : ["All", "Healing", "Stamina", "Resistance", "Utility"].map((t) => <Pill key={t} active={cat === t} onClick={() => setCat(t)}>{t === "All" ? "Any category" : t}</Pill>)}
          </div>

          <EditsPanel edits={edits} setEdits={setEdits} />
          {tab === "foods" && (
            <p className="mt-3 flex flex-wrap items-center gap-x-3 gap-y-1 text-sm text-stone-400">
              <span>Fork colour shows the focus:</span>
              {["Health", "Stamina", "Balanced", "Eitr"].map((t) => <FocusTag key={t} type={t} />)}
              <span className="inline-flex items-center gap-1"><TrophyIcon rank={1} size={14} /><TrophyIcon rank={2} size={14} /><TrophyIcon rank={3} size={14} />Trophies mark the top three for each focus within each biome.</span>
            </p>
          )}
          <p className="num mt-4 text-sm text-stone-500">{shown.length} {tab === "foods" ? "foods" : "meads"} shown</p>
          {shown.length === 0 ? (
            <div className="wood mt-3 rounded-sm p-6 text-center">
              <p className="text-stone-300">Nothing in the larder matches those filters.</p>
              <button onClick={reset} className="mt-2 rounded-sm border border-amber-700 px-3 py-1 font-bold text-amber-300 hover:bg-amber-500 hover:text-stone-950">Clear filters</button>
            </div>
          ) : (
            <div className={`mt-3 grid gap-3 ${tab === "foods" ? "sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4" : "lg:grid-cols-2"}`}>
              <AnimatePresence mode="popLayout" initial={false}>
                {tab === "foods"
                  ? foods.map((f) => <FoodCard key={f.id} f={f} selected={slots.includes(f.id)} full={slots.length >= 3} picked={picked} onToggle={toggle} onReplace={replaceAt} onStation={setStation} onIngredient={setIngredient} rank={ranks[f.id]} onSaveEdit={saveEdit} />)
                  : meads.map((m) => <MeadCard key={m.id} m={m} onStation={setStation} onIngredient={setIngredient} onSaveEdit={saveEdit} />)}
              </AnimatePresence>
            </div>
          )}
        </section>

        <AnimatePresence>{station && <StationModal key="station" open={station} onClose={() => setStation(null)} />}</AnimatePresence>
        <AnimatePresence>{ingredient && <IngredientModal key="ingredient" name={ingredient} foods={foodsAll} onPick={setIngredient} onClose={() => setIngredient(null)} />}</AnimatePresence>
        <AnimatePresence>{news && !station && !ingredient && <NewsModal key="news" onClose={closeNews} />}</AnimatePresence>

        <footer className="mt-10 border-t border-stone-800 pt-4 text-sm text-stone-500">
          <p className="max-w-prose">Stats follow the community wiki. Ashlands recipe quantities and regen ticks, and the Deep North entries from the 1.0 launch guides, are the least certain, so check them in game before a long farming trip. Station build costs come from memory and guides, so treat them as a guide too. Feasts and the Bog Witch utility brews are not listed.</p>
          <button type="button" onClick={() => setNews(true)} className="mt-2 flex items-center gap-1.5 text-sm font-bold text-stone-400 underline decoration-dotted underline-offset-2 hover:text-amber-300"><Megaphone size={14} aria-hidden="true" />What's new</button>
        </footer>
      </div>
    </MotionConfig>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

const fmtDur = (s) => (s >= 60 ? `${Math.round(s / 60)}m` : `${s}s`);
const fuzzyOne = (q, t) => {
  t = t.toLowerCase();
  if (t.includes(q)) return true;
  let i = 0;
  for (const c of t) { if (c === q[i]) i++; if (i === q.length) return true; }
  return false;
};
const fuzzy = (q, item) => {
  q = q.trim().toLowerCase().replace(/\s+/g, "");
  if (!q) return true;
  return fuzzyOne(q, item.name.replace(/\s+/g, "")) || item.ing.some(([n]) => fuzzyOne(q, n.replace(/\s+/g, "")));
};
// Best foods available up to a biome tier. Falls back to stamina when no eitr food exists yet.
const buildPreset = (pick, tier) => {
  const pool = FOODS.filter((f) => BIOMES.indexOf(f.biome) <= tier);
  const chosen = [];
  pick.forEach((stat) => {
    let cands = pool.filter((f) => !chosen.includes(f.id));
    if (stat === "eitr" && !cands.some((f) => f.eitr > 0)) stat = "st";
    cands.sort((a, b) => b[stat] - a[stat] || b.regen - a.regen);
    if (cands[0]) chosen.push(cands[0].id);
  });
  return chosen;
};

  <ul className="flex flex-wrap gap-x-3 gap-y-0.5 text-sm text-stone-300">
    {ing.map(([n, q]) => <li key={n}><span className="num font-bold text-amber-400">{q}×</span> {n}</li>)}
  </ul>
) : <p className="text-sm italic text-stone-500">No recipe. Gather it in the wild.</p>;

const StatBar = ({ stat, total, parts }) => {
  const s = STAT[stat];
  const pct = (v) => `${Math.min(100, (v / s.max) * 100)}%`;
  const segs = [{ k: "base", v: BASE[stat], cls: "bg-stone-500" }, ...parts.map((v, i) => ({ k: i, v, cls: s.bg, o: 1 - i * 0.22 }))];
  return (
    <div className="min-w-0">
      <div className="flex items-baseline justify-between gap-2">
        <span className={`flex items-center gap-1 text-xs font-bold uppercase tracking-wider ${s.text}`}><s.Icon size={12} aria-hidden="true" />{s.label}</span>
        <motion.span key={total} initial={{ scale: 1.25 }} animate={{ scale: 1 }} className={`num display text-2xl leading-none ${s.text}`}>{total}</motion.span>
      </div>
      <div className="mt-1 flex h-2.5 overflow-hidden rounded-sm border border-stone-700 bg-stone-950" role="img" aria-label={`${s.label} ${total}`}>
        {segs.map((g) => (
          <motion.div key={g.k} className={`${g.cls} h-full border-r border-stone-950/60`} style={{ opacity: g.o ?? 1 }}
            initial={false} animate={{ width: pct(g.v) }} transition={{ type: "spring", stiffness: 170, damping: 24 }} />
        ))}
      </div>
    </div>
  );
};

const StationChips = ({ station, level, onOpen }) => {
  const parts = stationParts(station);
  const isSource = ["Foraged", "Farmed", "Beehive"].includes(parts[0]);
  return (
    <div className="flex flex-wrap items-center gap-1.5">
      <span className="text-xs font-bold uppercase tracking-wider text-stone-400">{isSource ? "From" : "Made at"}</span>
      {parts.map((p) => STATIONS[p] ? (
        <button key={p} onClick={() => onOpen({ name: p, level: p === "Cauldron" ? level : null })} title={`What you need for the ${STATIONS[p].title}`}
          className="flex items-center gap-1 rounded-sm border border-amber-600 bg-amber-950/60 px-1.5 py-0.5 text-sm font-bold text-amber-200 transition-colors hover:bg-amber-500 hover:text-stone-950">
          <Hammer size={13} aria-hidden="true" />{STATIONS[p].title}{p === "Cauldron" && level ? ` Lv ${level}` : ""}<Info size={12} className="opacity-70" aria-hidden="true" />
        </button>
      ) : <span key={p} className="rounded-sm border border-stone-700 px-1.5 py-0.5 text-sm text-stone-300">{p === "Foraged" ? "The wild" : p}</span>)}
    </div>
  );
};

const CostList = ({ cost }) => (
  <ul className="flex flex-wrap gap-x-3 gap-y-0.5 text-stone-200">
    {cost.map(([n, q]) => <li key={n}><span className="num font-bold text-amber-400">{q}×</span> {n}</li>)}
  </ul>
);
const StationModal = ({ open, onClose }) => {
  const st = STATIONS[open.name];
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);
  return (
    <motion.div className="fixed inset-0 z-40 flex items-end justify-center bg-black/75 p-4 sm:items-center" onClick={onClose}
      initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}>
      <motion.div role="dialog" aria-modal="true" aria-labelledby="station-h" onClick={(e) => e.stopPropagation()}
        initial={{ y: 24, opacity: 0 }} animate={{ y: 0, opacity: 1 }} exit={{ y: 24, opacity: 0 }} transition={{ duration: 0.18 }}
        className="wood max-h-[85vh] w-full max-w-md overflow-y-auto rounded-sm p-4 shadow-2xl shadow-black">
        <div className="flex items-start justify-between gap-3">
          <div>
            <p className="text-xs font-bold uppercase tracking-widest text-amber-500">How to build</p>
            <h2 id="station-h" className="display text-3xl leading-tight text-stone-100">{st.title}</h2>
          </div>
          <button onClick={onClose} autoFocus className="flex shrink-0 items-center gap-1 rounded-sm border border-stone-600 px-2 py-1 text-sm font-bold text-stone-200 hover:border-amber-500 hover:text-amber-300"><X size={14} aria-hidden="true" />Close</button>
        </div>
        {st.levels ? (
          <div className="mt-3">
            {open.level && <p className="mb-2 rounded-sm border border-amber-700 bg-amber-950/50 px-2 py-1 text-amber-100">This recipe needs a <strong>level {open.level}</strong> cauldron, so build every piece up to and including level {open.level}.</p>}
            <ol className="flex flex-col gap-1.5">
              {st.levels.map(([lv, name, cost]) => (
                <li key={lv} className={`rounded-sm border px-2 py-1.5 ${open.level && lv <= open.level ? "border-amber-700/80 bg-stone-950/50" : "border-stone-700/70 opacity-60"}`}>
                  <p className="font-bold text-stone-100"><span className="num text-amber-400">Lv {lv}</span> · {name}</p>
                  {cost ? <CostList cost={cost} /> : <p className="text-sm italic text-stone-400">Materials not confirmed here. Check the build menu.</p>}
                </li>
              ))}
            </ol>
          </div>
        ) : (
          <div className="mt-3">
            <h3 className="mb-1 text-xs font-bold uppercase tracking-wider text-stone-400">Materials</h3>
            <CostList cost={st.cost} />
          </div>
        )}
        <dl className="mt-3 flex flex-col gap-1.5 border-t border-stone-700 pt-3 text-stone-300">
          <div><dt className="text-xs font-bold uppercase tracking-wider text-stone-400">Placement</dt><dd>{st.near}</dd></div>
          {st.fire && <div><dt className="text-xs font-bold uppercase tracking-wider text-stone-400">Heat</dt><dd>{st.fire}</dd></div>}
        </dl>
        <p className="mt-3 text-sm text-stone-400">{st.note}</p>
      </motion.div>
    </motion.div>
  );
};

/* ───────── Cards ───────── */
const FoodCard = ({ f, selected, full, onToggle, onStation }) => (
  <motion.article layout initial={{ opacity: 0, y: 8 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, scale: 0.97 }}
    whileHover={{ y: -3 }} transition={{ duration: 0.18 }}
    className={`wood flex flex-col gap-2 rounded-sm p-3 shadow-lg shadow-black/30 ${selected ? "ring-2 ring-amber-500" : "hover:border-amber-700"}`}>
    <header className="flex items-start justify-between gap-2">
      <div className="min-w-0">
        <h3 className="display text-xl leading-tight text-stone-100">{f.name}</h3>
        <p className="text-xs uppercase tracking-wider"><span className={BIOME_TINT[f.biome]}>{f.biome}</span><span className="text-stone-500"> · {f.type}</span></p>
      </div>
      <button onClick={() => onToggle(f.id)} disabled={!selected && full}
        className={`flex shrink-0 items-center gap-1 rounded-sm border px-2 py-1 text-sm font-bold transition-colors ${selected ? "border-amber-500 bg-amber-500 text-stone-950 hover:bg-amber-400" : "border-amber-700 text-amber-300 hover:bg-amber-500 hover:text-stone-950 disabled:cursor-not-allowed disabled:border-stone-700 disabled:text-stone-600 disabled:hover:bg-transparent"}`}>
        {selected ? <><Check size={14} aria-hidden="true" />On plate</> : full ? "Plates full" : <><Plus size={14} aria-hidden="true" />Eat</>}
      </button>
    </header>
    <div className="flex flex-wrap items-center gap-1.5">
      <Badge stat="hp" value={f.hp} /><Badge stat="st" value={f.st} /><Badge stat="eitr" value={f.eitr} />
    </div>
    <dl className="num flex flex-wrap gap-x-4 gap-y-1 text-sm text-stone-400">
      <div className="flex items-center gap-1" title="How long this food lasts after eating"><Timer size={13} aria-hidden="true" /><dt className="sr-only">Duration</dt><dd>Lasts {fmtDur(f.duration)}</dd></div>
      <div className="flex items-center gap-1"><Activity size={13} aria-hidden="true" /><dt className="sr-only">Health regen</dt><dd>{f.regen} hp/tick</dd></div>
    </dl>
    <StationChips station={f.station} level={cauldronLevel(f)} onOpen={onStation} />
    <div className="mt-auto border-t border-stone-700/70 pt-2">
      <Ingredients ing={f.ing} />
      {f.yieldN > 1 && <p className="mt-1 text-xs text-stone-500">One craft makes {f.yieldN}.</p>}
    </div>
  </motion.article>
);

const CAT = { Healing: "bg-red-950/70 text-red-300 border-red-800/70", Stamina: "bg-yellow-950/60 text-yellow-200 border-yellow-700/60",
  Resistance: "bg-sky-950/70 text-sky-200 border-sky-800/70", Utility: "bg-purple-950/70 text-purple-200 border-purple-700/70" };
const Step = ({ Icon, title, children }) => (
  <div className="min-w-0 flex-1 rounded-sm border border-stone-700/80 bg-stone-950/40 p-2.5">
    <p className="mb-1 flex items-center gap-1.5 text-xs font-bold uppercase tracking-wider text-amber-400"><Icon size={13} aria-hidden="true" />{title}</p>
    {children}
  </div>
);
const MeadCard = ({ m, onStation }) => (
  <motion.article layout initial={{ opacity: 0, y: 8 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, scale: 0.97 }}
    whileHover={{ y: -3 }} transition={{ duration: 0.18 }} className="wood flex flex-col gap-3 rounded-sm p-3.5 shadow-lg shadow-black/30 hover:border-amber-700">
    <header className="flex items-start justify-between gap-2">
      <div className="min-w-0">
        <h3 className="display text-xl leading-tight text-stone-100">{m.name}</h3>
        <p className={`text-xs uppercase tracking-wider ${BIOME_TINT[m.biome]}`}>{m.biome}</p>
      </div>
      <span className={`shrink-0 rounded-sm border px-1.5 py-0.5 text-xs font-bold uppercase tracking-wider ${CAT[m.category]}`}>{m.category}</span>
    </header>
    <p className="text-base font-medium text-amber-100">{m.effect}</p>
    <p className="num flex flex-wrap gap-x-4 text-sm text-stone-400">
      <span className="flex items-center gap-1"><Clock size={13} aria-hidden="true" />Lasts {fmtDur(m.duration)}</span>
      <span className="flex items-center gap-1"><Hourglass size={13} aria-hidden="true" />Cooldown {fmtDur(m.cooldown)}</span>
    </p>
    <StationChips station={m.station} onOpen={onStation} />
    <div className="mt-auto flex flex-col items-stretch gap-1.5 sm:flex-row sm:items-stretch">
      <Step Icon={Flame} title="Mead base (Mead Ketill)"><Ingredients ing={m.ing} /></Step>
      <Arrow size={16} className="hidden shrink-0 self-center text-amber-600 sm:block" aria-hidden="true" />
      <Step Icon={Hourglass} title="Ferment"><p className="text-sm text-stone-300">2 in-game days in a Fermenter, about 1 hour of play.</p></Step>
      <Arrow size={16} className="hidden shrink-0 self-center text-amber-600 sm:block" aria-hidden="true" />
      <Step Icon={Beer} title="Yield"><p className="display num text-2xl leading-none text-amber-300">{m.yieldN}×</p><p className="text-sm text-stone-300">meads per base</p></Step>
    </div>
  </motion.article>
);

/* ───────── App ───────── */
function App() {
  const [slots, setSlots] = useState(() => buildPreset(["hp", "st", "eitr"], 7));
  const [tier, setTier] = useState(7);
  const [tab, setTab] = useState("foods");
  const [biome, setBiome] = useState("All");
  const [focus, setFocus] = useState("All");
  const [cat, setCat] = useState("All");
  const [q, setQ] = useState("");
  const [sort, setSort] = useState("progression");
  const [showList, setShowList] = useState(false);
  const [station, setStation] = useState(null);

  const picked = slots.map((id) => FOODS.find((f) => f.id === id)).filter(Boolean);
  const totals = {
    hp: BASE.hp + picked.reduce((a, f) => a + f.hp, 0),
    st: BASE.st + picked.reduce((a, f) => a + f.st, 0),
    eitr: BASE.eitr + picked.reduce((a, f) => a + f.eitr, 0),
    regen: picked.reduce((a, f) => a + f.regen, 0),
  };
  const shopping = useMemo(() => {
    const map = new Map();
    picked.forEach((f) => (f.ing.length ? f.ing : [[f.name, 1]]).forEach(([n, qty]) => map.set(n, (map.get(n) || 0) + qty)));
    return [...map.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  }, [slots.join("|")]);

  const toggle = (id) => setSlots((s) => (s.includes(id) ? s.filter((x) => x !== id) : s.length < 3 ? [...s, id] : s));

  const foods = useMemo(() => {
    const list = FOODS.filter((f) => (biome === "All" || f.biome === biome) && (focus === "All" || f.type === focus) && fuzzy(q, f));
    const by = { health: (a, b) => b.hp - a.hp, stamina: (a, b) => b.st - a.st, eitr: (a, b) => b.eitr - a.eitr, duration: (a, b) => b.duration - a.duration };
    return sort === "progression" ? list : [...list].sort(by[sort]);
  }, [biome, focus, q, sort]);
  const meads = useMemo(() => {
    const list = MEADS.filter((m) => (biome === "All" || m.biome === biome) && (cat === "All" || m.category === cat) && fuzzy(q, m));
    return sort === "duration" ? [...list].sort((a, b) => b.duration - a.duration) : list;
  }, [biome, cat, q, sort]);
  const shown = tab === "foods" ? foods : meads;
  const reset = () => { setBiome("All"); setFocus("All"); setCat("All"); setQ(""); };

  return (
    <MotionConfig reducedMotion="user">
      <div className="mx-auto max-w-7xl px-4 pb-16">
        <header className="pb-5 pt-8">
          <p className="rune" aria-hidden="true">ᚠᛟᛟᛞ ᚨᚾᛞ ᛗᛖᚨᛞ</p>
          <h1 className="display text-4xl font-bold text-amber-400 sm:text-5xl">Valheim Mead &amp; Feast Planner</h1>
          <p className="mt-1 max-w-prose text-lg text-stone-400">Fill three plates, read your health, stamina and eitr before you leave the hall, and see what to gather.</p>

          <section aria-labelledby="presets-h" className="mt-5">
            <div className="flex flex-wrap items-center gap-x-3 gap-y-2">
              <h2 id="presets-h" className="text-xs font-bold uppercase tracking-widest text-stone-400">Quick builds</h2>
              <label htmlFor="tier" className="flex items-center gap-2 text-sm text-stone-400">using food up to
                <select id="tier" value={tier} onChange={(e) => setTier(+e.target.value)} className="rounded-sm border border-stone-700 px-2 py-1 text-stone-100">
                  {BIOMES.map((b, i) => <option key={b} value={i}>{b}</option>)}
                </select>
              </label>
            </div>
            <div className="mt-2 grid grid-cols-2 gap-2 lg:grid-cols-4">
              {PRESETS.map((p) => (
                <motion.button key={p.id} whileTap={{ scale: 0.97 }} onClick={() => setSlots(buildPreset(p.pick, tier))}
                  className="wood group flex items-center gap-2.5 rounded-sm p-2.5 text-left transition-colors hover:border-amber-500">
                  <p.Icon size={22} className="shrink-0 text-amber-500 transition-transform group-hover:scale-110" aria-hidden="true" />
                  <span className="min-w-0"><span className="block font-bold leading-tight text-stone-100">{p.label}</span><span className="block text-sm text-stone-400">{p.hint}</span></span>
                </motion.button>
              ))}
            </div>
          </section>
        </header>

        {/* Sticky meal builder */}
        <section aria-label="Meal builder" className="sticky z-20 -mx-4 border-y border-amber-900/60 bg-stone-900/95 px-4 py-3 shadow-xl shadow-black/50 backdrop-blur"
          style={{ top: "env(safe-area-inset-top, 0px)" }}>
          <div className="grid grid-cols-3 gap-2">
            {[0, 1, 2].map((i) => {
              const f = picked[i];
              return (
                <div key={i} className={`flex min-h-[4.5rem] min-w-0 items-stretch rounded-sm border px-2 py-1.5 ${f ? "wood" : "items-center border-dashed border-stone-700 bg-stone-950/40"}`}>
                  <AnimatePresence mode="wait" initial={false}>
                    {f ? (
                      <motion.div key={f.id} initial={{ opacity: 0, y: 6 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: -6 }} transition={{ duration: 0.15 }} className="flex min-w-0 flex-1 flex-col gap-1.5">
                        <div className="flex items-start justify-between gap-1.5">
                          <p className="min-w-0 break-words text-sm font-bold leading-tight text-stone-100 sm:text-base">{f.name}</p>
                          <button onClick={() => toggle(f.id)} aria-label={`Remove ${f.name} from plate ${i + 1}`}
                            className="flex shrink-0 items-center gap-1 rounded-sm border border-red-800 bg-red-950/60 px-1.5 py-0.5 text-xs font-bold text-red-200 transition-colors hover:bg-red-600 hover:text-white">
                            <X size={13} aria-hidden="true" /><span className="hidden sm:inline">Remove</span>
                          </button>
                        </div>
                        <div className="mt-auto flex flex-wrap items-center gap-1">
                          {["hp", "st", "eitr"].filter((k) => f[k] > 0).map((k) => <Badge key={k} stat={k} value={`+${f[k]}`} small />)}
                          <span className="num inline-flex items-center gap-0.5 rounded-sm border border-stone-600 px-1 py-px text-xs font-bold text-stone-300" title="How long this food lasts after eating"><Timer size={11} aria-hidden="true" />{fmtDur(f.duration)}<span className="hidden font-normal sm:inline">&nbsp;buff</span></span>
                        </div>
                      </motion.div>
                    ) : (
                      <motion.p key="empty" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="flex items-center gap-1.5 self-center text-sm text-stone-500"><Utensils size={14} aria-hidden="true" />Plate {i + 1} is empty</motion.p>
                    )}
                  </AnimatePresence>
                </div>
              );
            })}
          </div>
          <div className="mt-3 grid grid-cols-3 gap-3 sm:grid-cols-[1fr_1fr_1fr_auto] sm:items-end">
            {["hp", "st", "eitr"].map((s) => <StatBar key={s} stat={s} total={totals[s]} parts={picked.map((f) => f[s])} />)}
            <div className="col-span-3 flex items-center justify-between gap-3 sm:col-span-1 sm:justify-end">
              <p className="num text-sm text-stone-300"><span className="display text-xl text-red-300">+{totals.regen}</span> hp per 10s tick</p>
              <div className="flex flex-wrap justify-end gap-1.5">
                <button onClick={() => setShowList((v) => !v)} aria-expanded={showList} className="flex items-center gap-1.5 rounded-sm border border-amber-700 px-2.5 py-1.5 text-sm font-bold text-amber-300 hover:bg-amber-500 hover:text-stone-950">
                  <Basket size={15} aria-hidden="true" />Shopping list
                  <Chevron size={14} className={`transition-transform ${showList ? "rotate-180" : ""}`} aria-hidden="true" />
                </button>
                <button onClick={() => setSlots([])} disabled={!picked.length} className="flex items-center gap-1.5 rounded-sm border border-stone-600 px-2.5 py-1.5 text-sm font-bold text-stone-300 hover:border-red-600 hover:text-red-300 disabled:opacity-30"><Trash size={15} aria-hidden="true" />Clear plates</button>
              </div>
            </div>
          </div>
          <AnimatePresence initial={false}>
            {showList && (
              <motion.div initial={{ height: 0, opacity: 0 }} animate={{ height: "auto", opacity: 1 }} exit={{ height: 0, opacity: 0 }} className="overflow-hidden">
                <div className="mt-3 max-h-[40vh] overflow-y-auto border-t border-stone-700 pt-3">
                  {shopping.length ? (
                    <>
                      <ul className="grid grid-cols-2 gap-x-4 gap-y-1 sm:grid-cols-3 lg:grid-cols-4">
                        {shopping.map(([n, qty]) => <li key={n} className="flex items-baseline gap-2 text-stone-200"><span className="num w-8 shrink-0 text-right font-bold text-amber-400">{qty}×</span><span className="min-w-0">{n}</span></li>)}
                      </ul>
                      <p className="mt-2 text-sm text-stone-500">Raw ingredients for one craft of each recipe. Base stats without food are 25 health and 50 stamina.</p>
                    </>
                  ) : <p className="text-stone-500">Put a food on a plate and its ingredients will be tallied here.</p>}
                </div>
              </motion.div>
            )}
          </AnimatePresence>
        </section>

        {/* Explorer */}
        <section aria-label="Database" className="pt-6">
          <div className="flex flex-wrap items-center gap-3">
            <div role="tablist" className="flex rounded-sm border border-stone-700 bg-stone-950/50 p-0.5">
              {[["foods", "Foods", Utensils, FOODS.length], ["meads", "Drinks & Meads", Flask, MEADS.length]].map(([id, label, Ic, n]) => (
                <button key={id} role="tab" aria-selected={tab === id} onClick={() => { setTab(id); setSort("progression"); }}
                  className={`relative flex items-center gap-1.5 rounded-sm px-3 py-1.5 font-bold transition-colors ${tab === id ? "text-stone-950" : "text-stone-300 hover:text-amber-300"}`}>
                  {tab === id && <motion.span layoutId="tab" className="absolute inset-0 rounded-sm bg-amber-500" />}
                  <span className="relative flex items-center gap-1.5"><Ic size={15} aria-hidden="true" />{label}<span className="num text-xs opacity-70">{n}</span></span>
                </button>
              ))}
            </div>
            <div className="relative min-w-[12rem] flex-1">
              <Search size={16} className="pointer-events-none absolute left-2.5 top-1/2 -translate-y-1/2 text-stone-500" aria-hidden="true" />
              <label htmlFor="search" className="sr-only">Search by name or ingredient</label>
              <input id="search" value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search name or ingredient, e.g. honey"
                className="w-full rounded-sm border border-stone-700 bg-stone-950/60 py-1.5 pl-8 pr-3 text-stone-100 placeholder:text-stone-500" />
            </div>
            <label htmlFor="sort" className="flex items-center gap-2 text-sm text-stone-400">Sort
              <select id="sort" value={sort} onChange={(e) => setSort(e.target.value)} className="rounded-sm border border-stone-700 px-2 py-1.5 text-stone-100">
                <option value="progression">Progression order</option>
                {tab === "foods" && <><option value="health">Highest health</option><option value="stamina">Highest stamina</option><option value="eitr">Highest eitr</option></>}
                <option value="duration">Longest duration</option>
              </select>
            </label>
          </div>
          <div className="mt-3 flex flex-wrap gap-1.5" aria-label="Biome filter">
            {["All", ...BIOMES].map((b) => <Pill key={b} active={biome === b} onClick={() => setBiome(b)}>{b === "All" ? "All biomes" : b}</Pill>)}
          </div>
          <div className="mt-2 flex flex-wrap gap-1.5" aria-label={tab === "foods" ? "Stat focus filter" : "Category filter"}>
            {tab === "foods"
              ? ["All", "Health", "Stamina", "Eitr", "Balanced"].map((t) => <Pill key={t} active={focus === t} onClick={() => setFocus(t)}>{t === "All" ? "Any focus" : t}</Pill>)
              : ["All", "Healing", "Stamina", "Resistance", "Utility"].map((t) => <Pill key={t} active={cat === t} onClick={() => setCat(t)}>{t === "All" ? "Any category" : t}</Pill>)}
          </div>

          <p className="num mt-4 text-sm text-stone-500">{shown.length} {tab === "foods" ? "foods" : "meads"} shown</p>
          {shown.length === 0 ? (
            <div className="wood mt-3 rounded-sm p-6 text-center">
              <p className="text-stone-300">Nothing in the larder matches those filters.</p>
              <button onClick={reset} className="mt-2 rounded-sm border border-amber-700 px-3 py-1 font-bold text-amber-300 hover:bg-amber-500 hover:text-stone-950">Clear filters</button>
            </div>
          ) : (
            <div className={`mt-3 grid gap-3 ${tab === "foods" ? "sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4" : "lg:grid-cols-2"}`}>
              <AnimatePresence mode="popLayout" initial={false}>
                {tab === "foods"
                  ? foods.map((f) => <FoodCard key={f.id} f={f} selected={slots.includes(f.id)} full={slots.length >= 3} onToggle={toggle} onStation={setStation} />)
                  : meads.map((m) => <MeadCard key={m.id} m={m} onStation={setStation} />)}
              </AnimatePresence>
            </div>
          )}
        </section>

        <AnimatePresence>{station && <StationModal key="station" open={station} onClose={() => setStation(null)} />}</AnimatePresence>

        <footer className="mt-10 border-t border-stone-800 pt-4 text-sm text-stone-500">
          <p className="max-w-prose">Stats follow the community wiki. Ashlands recipe quantities and regen ticks, and the Deep North entries from the 1.0 launch guides, are the least certain, so check them in game before a long farming trip. Station build costs come from memory and guides, so treat them as a guide too. Feasts and the Bog Witch utility brews are not listed.</p>
        </footer>
      </div>
    </MotionConfig>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
